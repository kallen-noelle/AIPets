catalogMode: prefer
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Packages from the upstream team must always be trusted
  - '@auv-js/*'
  - '@gd-kirie/*'
  - '@moeru/*'
  - '@proj-airi/*'
  - '@sherpaw/*'
  - '@vishot/*'
  - '@vieval/*'
  - '@xsai/*'
  - '@xsai-apple-speech/*'
  - '@xsai-apple-vision/*'
  - '@xsai-ext/*'
  - '@xsai-transformers/*'
  - kirie
  - pinia-plugin-synced
  - xsschema
  - vieval

shellEmulator: true
packages:
  - packages/**
  - plugins/**
  - integrations/**
  - services/**
  - examples/**
  - evals/**
  - apps/**
  - server/**
  - '!**/dist/**'

overrides:
  '@types/hast': 'catalog:'
  array-flatten: npm:@nolyfill/array-flatten@^1.0.44
  axios: npm:feaxios@^0.0.23
  'eslint-plugin-sonarjs>typescript': 'catalog:'
  hono: 4.13.3
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39
  isarray: npm:@nolyfill/isarray@^1.0.44
  # rehype-katex 7.0.1 and micromark-extension-math 3.1.0 declare katex ^0.16. The speech transformers parse with the
  # catalog katex, so display and speech use one version. Remove when both declare the catalog version.
  micromark-extension-math>katex: 'catalog:'
  onnxruntime-web: npm:onnxruntime-web@^1.27.0
  rehype-katex>katex: 'catalog:'
  safe-buffer: npm:@nolyfill/safe-buffer@^1.0.44
  safer-buffer: npm:@nolyfill/safer-buffer@^1.0.44
  side-channel: npm:@nolyfill/side-channel@^1.0.44
  string.prototype.matchall: npm:@nolyfill/string.prototype.matchall@^1.0.44
patchedDependencies:
  '@xsai-ext/responses@0.5.1': patches/@xsai-ext__responses@0.5.1.patch
  sponsorkit@17.1.0: patches/sponsorkit@17.1.0.patch
